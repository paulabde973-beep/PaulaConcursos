<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Controle de Estudos · Concursos Administrativos</title>
<style>
:root{--bg:#fff4f7;--card:#fffafc;--tx:#4a2535;--mut:#8f6b7c;--ac:#c04b7a;--ac2:#fde3ec;--ok:#15803d;--bad:#b91c1c;--bd:#f6d1de;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2b1a23;--card:#38232f;--tx:#fdeaf2;--mut:#cfa8ba;--ac:#f4a3c2;--ac2:#4a2b3b;--ok:#4ade80;--bad:#f87171;--bd:#573648;--on:#3a1226}}
:root[data-theme="dark"]{--bg:#2b1a23;--card:#38232f;--tx:#fdeaf2;--mut:#cfa8ba;--ac:#f4a3c2;--ac2:#4a2b3b;--ok:#4ade80;--bad:#f87171;--bd:#573648;--on:#3a1226}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:860px;margin:0 auto;padding:16px}
h1{font:700 26px/1.2 Georgia,"Times New Roman",serif;margin:8px 0 2px}
h2{font-size:18px;margin:0 0 10px}
.sub{color:var(--mut);font-size:14px;margin:0 0 12px}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);border-radius:6px;transition:width .3s}
nav{display:flex;gap:6px;overflow-x:auto;margin:14px 0;padding-bottom:4px}
nav button{white-space:nowrap;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:20px;font:inherit;font-size:14px;cursor:pointer}
nav button.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{background:var(--ac2);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:24px;color:var(--ac)}.stat span{font-size:12px;color:var(--mut)}
input,select,textarea,button.b{font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);max-width:100%}
textarea{width:100%;min-height:60px}
button.b{background:var(--ac);color:var(--on);border-color:var(--ac);cursor:pointer}
button.g{background:transparent;color:var(--mut);border-color:var(--bd)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
label.t{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--bd);cursor:pointer}
label.t input{margin-top:5px}
label.t.d span{text-decoration:line-through;color:var(--mut)}
.pill{font-size:12px;padding:2px 8px;border-radius:10px;background:var(--ac2);color:var(--ac)}
.late{color:var(--bad);font-weight:600}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:12px;text-align:center}
.wk div{padding:8px 2px;border-radius:8px;background:var(--bg);border:1px solid var(--bd)}
.wk .hoje{background:var(--ac);color:var(--on);border-color:var(--ac)}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;cursor:pointer}.opt.ok{border:2px solid var(--ok)}.opt.bad{border:2px solid var(--bad)}.fc{min-height:150px;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;border:2px dashed var(--ac);border-radius:14px;cursor:pointer;font-size:18px;margin:10px 0}.hide{display:none}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
footer{color:var(--mut);font-size:12px;text-align:center;padding:20px 0}
</style></head>
<body><div class="w">
<h1>Meu Controle de Estudos</h1>
<p class="sub">Concursos administrativos · estudo por questões · 2 h por dia</p>
<div class="row" style="justify-content:space-between"><span class="sub" style="margin:0">Progresso dos assuntos</span><b id="pg">0%</b></div>
<div class="bar"><i id="pgb" style="width:0%"></i></div>
<nav id="nav"></nav>
<main id="v"></main>
<footer>Seus dados ficam salvos só neste navegador. Use o Backup para levar para outro aparelho.</footer>
</div>
<script>
var DISC={
"Língua Portuguesa":["Interpretação de texto","Tipologia e gêneros textuais","Ortografia e acentuação","Classes de palavras","Sintaxe da oração","Concordância verbal e nominal","Regência e crase","Pontuação","Coesão e coerência","Reescrita de frases"],
"Raciocínio Lógico":["Proposições e conectivos","Tabela-verdade","Equivalências lógicas","Negação de proposições","Diagramas lógicos","Porcentagem","Regra de três","Razão e proporção","Análise combinatória","Probabilidade","Sequências"],
"Direito Administrativo":["Princípios da Administração","Poderes administrativos","Atos administrativos","Organização administrativa","Agentes públicos e Lei 8.112","Licitações (Lei 14.133)","Contratos administrativos","Serviços públicos","Responsabilidade civil do Estado","Improbidade administrativa","Controle da Administração"],
"Direito Constitucional":["Princípios fundamentais","Direitos e garantias individuais","Direitos sociais","Nacionalidade","Direitos políticos","Organização do Estado","Administração Pública (art. 37)","Poder Legislativo","Poder Executivo","Poder Judiciário","Controle de constitucionalidade"],
"Informática":["Hardware e software","Windows","Word e Excel","Navegadores e internet","E-mail","Segurança da informação","Redes","Nuvem e armazenamento"],
"Administração Pública":["Funções administrativas","Planejamento e gestão estratégica","Modelos de gestão pública","Gestão por processos","Administração de materiais","Ética no serviço público","Atendimento ao público"],
"Arquivologia":["Conceitos e princípios","Ciclo vital dos documentos","Classificação e arquivamento","Gestão documental","Protocolo"],
"Gestão de Pessoas":["Recrutamento e seleção","Treinamento e desenvolvimento","Avaliação de desempenho","Clima e cultura organizacional","Liderança e motivação"]};
var NAMES=Object.keys(DISC);
var WK=[["Dom","Folga"],["Seg","Língua Portuguesa"],["Ter","Raciocínio Lógico"],["Qua","Direito Administrativo"],["Qui","Direito Constitucional"],["Sex","Informática"],["Sáb","Questões misturadas"]];
var INT=[7,14,30];
var S={done:{},custom:[],log:[],errs:[]};
var tab="hoje";
try{var r=localStorage.getItem("ce1");if(r){var p=JSON.parse(r);if(p&&typeof p==="object")S=Object.assign(S,p)}}catch(e){}
function save(){S.cards=S.cards||[];try{localStorage.setItem("ce1",JSON.stringify(S))}catch(e){}}
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function today(){return iso(new Date())}
function addD(s,n){var d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return iso(d)}
function fmt(s){var a=s.split("-");return a[2]+"/"+a[1]}
function topics(d){return DISC[d].concat(S.custom.filter(function(c){return c.d===d}).map(function(c){return c.t}))}
function pct(a,b){return b?Math.round(a/b*100):0}
function totals(){var t=0,k=0;NAMES.forEach(function(d){topics(d).forEach(function(x){t++;if(S.done[d+"|"+x])k++})});return[k,t]}
function streak(){var days={};S.log.forEach(function(l){days[l.d]=1});var d=today(),n=0;if(!days[d])d=addD(d,-1);while(days[d]){n++;d=addD(d,-1)}return n}
function head(){var a=totals(),p=pct(a[0],a[1]);$("pg").textContent=p+"%";$("pgb").style.width=p+"%"}
function nav(){var T=[["hoje","Hoje"],["assuntos","Assuntos"],["questoes","Questões"],["gerar","Gerar questões"],["cards","Flashcards"],["erros","Caderno de erros"],["progresso","Progresso"],["backup","Backup"]];
$("nav").innerHTML=T.map(function(t){return'<button class="'+(tab===t[0]?"on":"")+'" onclick="go(\''+t[0]+'\')">'+t[1]+"</button>"}).join("")}
function go(t){tab=t;nav();head();VIEW[t]()}
function dueErrs(){var t=today();return S.errs.filter(function(e){return !e.ok&&e.next<=t})}
function opts(){return NAMES.concat(["Questões misturadas"]).map(function(n){return"<option>"+n+"</option>"}).join("")}
var VIEW={
hoje:function(){var d=new Date(),w=WK[d.getDay()],tl=S.log.filter(function(l){return l.d===today()});
var n=0,c=0;tl.forEach(function(l){n+=l.n;c+=l.c});
var wk=WK.slice(1).concat([WK[0]]).map(function(x){return'<div class="'+(x[0]===w[0]?"hoje":"")+'"><b>'+x[0]+"</b><br>"+x[1].replace("Língua ","").replace("Raciocínio ","Rac. ").replace("Direito ","Dir. ").replace("Questões misturadas","Mistas")+"</div>"}).join("");
var due=dueErrs().length;
$("v").innerHTML='<div class="card"><h2>Hoje é '+w[0]+": "+w[1]+'</h2><div class="wk">'+wk+'</div></div>'+
'<div class="card"><h2>Sua sessão de 2 horas</h2><label class="t"><span><b>1h30</b> · blocos de 10 a 15 questões de '+esc(w[1])+'</span></label><label class="t"><span><b>20 min</b> · ler o comentário de cada questão, inclusive as que acertou no chute</span></label><label class="t"><span><b>10 min</b> · anotar no caderno de erros a regra que faltou (uma linha)</span></label></div>'+
'<div class="card"><h2>Registrar questões</h2><div class="row"><select id="ld">'+opts()+'</select><input id="ln" type="number" min="1" placeholder="Feitas" style="width:90px"><input id="lc" type="number" min="0" placeholder="Acertos" style="width:90px"><button class="b" onclick="addLog()">Salvar</button></div><p class="sub" style="margin:0">Hoje: '+n+" questões, "+pct(c,n)+"% de acertos · sequência de "+streak()+" dia(s)</p></div>"+
(due?'<div class="card"><span class="late">'+due+' erro(s) para revisar hoje.</span> <button class="b" onclick="go(\'erros\')">Abrir caderno</button></div>':"");
var m=w[1];var sel=$("ld");for(var i=0;i<sel.options.length;i++)if(sel.options[i].text===m)sel.selectedIndex=i},
assuntos:function(){$("v").innerHTML=NAMES.map(function(d,i){var l=topics(d),k=l.filter(function(x){return S.done[d+"|"+x]}).length;
return'<div class="card"><div class="hd" onclick="tg('+i+')"><h2 style="margin:0">'+d+'</h2><span class="pill">'+k+"/"+l.length+'</span></div><div class="bar" style="margin-top:8px"><i style="width:'+pct(k,l.length)+'%"></i></div><div id="a'+i+'" class="hide">'+l.map(function(x,j){var on=S.done[d+"|"+x];return'<label class="t '+(on?"d":"")+'"><input type="checkbox" '+(on?"checked":"")+' onchange="ck('+i+","+j+',this.checked)"><span>'+esc(x)+"</span></label>"}).join("")+'<div class="row"><input id="n'+i+'" placeholder="Novo assunto" style="flex:1"><button class="b g" onclick="addT('+i+')">Adicionar</button></div></div></div>'}).join("")},
questoes:function(){var by={};S.log.forEach(function(l){var o=by[l.d2]||(by[l.d2]={n:0,c:0});o.n+=l.n;o.c+=l.c});
var rows=Object.keys(by).map(function(k){var o=by[k],p=pct(o.c,o.n);return'<div style="margin:8px 0"><div class="row" style="justify-content:space-between;margin:0"><span>'+esc(k)+'</span><span class="sub" style="margin:0">'+o.c+"/"+o.n+" · "+p+'%</span></div><div class="bar"><i style="width:'+p+'%;background:'+(p>=70?"var(--ok)":p>=50?"var(--ac)":"var(--bad)")+'"></i></div></div>'}).join("")||'<p class="sub">Registre sua primeira sessão na aba Hoje.</p>';
var h=S.log.slice(-15).reverse().map(function(l){return'<div class="row" style="justify-content:space-between;margin:4px 0;border-bottom:1px solid var(--bd)"><span>'+fmt(l.d)+" · "+esc(l.d2)+"</span><span>"+l.c+"/"+l.n+' <button class="b g" onclick="delLog('+l.id+')">×</button></span></div>'}).join("");
$("v").innerHTML='<div class="card"><h2>Aproveitamento por matéria</h2><p class="sub">Meta: 70% ou mais. Abaixo de 50%, volte ao conteúdo daquela matéria.</p>'+rows+'</div><div class="card"><h2>Últimos registros</h2>'+(h||'<p class="sub">Nada ainda.</p>')+"</div>"},
erros:function(){var t=today(),open=S.errs.filter(function(e){return !e.ok}),done=S.errs.length-open.length;
var li=open.sort(function(a,b){return a.next<b.next?-1:1}).map(function(e){var late=e.next<=t;return'<div class="card"><div class="row" style="justify-content:space-between;margin:0"><span class="pill">'+esc(e.d2)+'</span><span class="'+(late?"late":"sub")+'" style="margin:0">'+(late?"Revisar hoje":"Próxima: "+fmt(e.next))+'</span></div><p>'+esc(e.t)+'</p><div class="row" style="margin:0"><button class="b" onclick="rev('+e.id+')">Revisei ('+e.r+"/3)</button> <button class=\"b g\" onclick=\"delErr("+e.id+')">Apagar</button></div></div>'}).join("")||'<p class="sub">Nenhum erro anotado ainda.</p>';
$("v").innerHTML='<div class="card"><h2>Novo erro</h2><p class="sub">Escreva a regra ou o conceito que faltou, em uma linha. Revisões em 7, 14 e 30 dias.</p><div class="row"><select id="ed">'+opts()+'</select></div><textarea id="et" placeholder="Ex.: Crase não ocorre antes de verbo"></textarea><div class="row"><button class="b" onclick="addErr()">Salvar erro</button></div></div><p class="sub">Dominados: '+done+"</p>"+li},
progresso:function(){var a=totals(),n=0,c=0;S.log.forEach(function(l){n+=l.n;c+=l.c});
var days=[];for(var i=6;i>=0;i--){var d=addD(today(),-i),q=0;S.log.forEach(function(l){if(l.d===d)q+=l.n});days.push([d,q])}
var mx=Math.max.apply(null,days.map(function(x){return x[1]}).concat([1]));
var bars=days.map(function(x){return'<div style="flex:1;text-align:center;font-size:11px"><div style="height:80px;display:flex;align-items:flex-end"><div style="width:100%;height:'+Math.max(x[1]/mx*100,2)+'%;background:var(--ac);border-radius:4px 4px 0 0"></div></div>'+x[1]+"<br>"+fmt(x[0])+"</div>"}).join("");
var per=NAMES.map(function(d){var l=topics(d),k=l.filter(function(x){return S.done[d+"|"+x]}).length;return'<div style="margin:8px 0"><div class="row" style="justify-content:space-between;margin:0"><span>'+d+'</span><span class="sub" style="margin:0">'+k+"/"+l.length+'</span></div><div class="bar"><i style="width:'+pct(k,l.length)+'%"></i></div></div>'}).join("");
$("v").innerHTML='<div class="grid"><div class="stat"><b>'+streak()+'</b><span>dias seguidos</span></div><div class="stat"><b>'+n+'</b><span>questões feitas</span></div><div class="stat"><b>'+pct(c,n)+'%</b><span>aproveitamento</span></div><div class="stat"><b>'+a[0]+"/"+a[1]+'</b><span>assuntos vistos</span></div></div><div class="card" style="margin-top:12px"><h2>Questões nos últimos 7 dias</h2><div style="display:flex;gap:6px">'+bars+'</div></div><div class="card"><h2>Assuntos por matéria</h2>'+per+"</div>"},
backup:function(){$("v").innerHTML='<div class="card"><h2>Exportar</h2><p class="sub">Baixa um arquivo com todo o seu progresso.</p><button class="b" onclick="exp()">Baixar backup</button></div><div class="card"><h2>Importar</h2><p class="sub">Restaura o progresso de um backup anterior.</p><input type="file" accept=".json" onchange="imp(this)"></div><div class="card"><h2>Apagar tudo</h2><p class="sub">Remove todo o progresso. Não dá para desfazer.</p><button class="b g" onclick="wipe()">Apagar progresso</button></div>'}
};
var G={qs:[],i:0,ok:0,bad:0,a:null,load:false,err:"",d:"",logged:false};
var C={q:[],flip:false};
var INTC=[1,3,7,14,30];
function ai(p){if(!(window.claude&&claude.use))return Promise.reject({code:"na"});return claude.use("sample").then(function(s){if(!s)throw {code:"na"};return s.json(p)})}
function emsg(e){return e&&e.code==="rate_limited"?"Muitas solicitações seguidas. Espere um minuto e tente de novo.":"A geração com IA só funciona com a página aberta no Claude e com a sua permissão. Tente de novo ou use a opção manual."}
function dopts(){return NAMES.map(function(n){return"<option>"+n+"</option>"}).join("")}
function sub(){var d=$("gd").value;$("ga").innerHTML='<option value="">Qualquer assunto</option>'+topics(d).map(function(t){return"<option>"+esc(t)+"</option>"}).join("")}
VIEW.gerar=function(){$("v").innerHTML='<div class="card"><h2>Gerar questões com IA</h2><p class="sub">Questões criadas por IA para treino. Confira pontos de lei e dúvidas em fontes oficiais antes de decorar.</p><div class="row"><select id="gd" onchange="sub()">'+dopts()+'</select><select id="ga"></select></div><div class="row"><select id="gb"><option>Cebraspe</option><option>FGV</option><option>FCC</option><option>IBADE</option><option>Instituto AOCP</option><option>Cesgranrio</option></select><select id="gn"><option>5</option><option selected>10</option><option>15</option></select><select id="gl"><option>Nível médio</option><option>Nível superior</option></select><button class="b" onclick="gen()">Gerar</button></div></div><div id="gq"></div>';var w=WK[new Date().getDay()][1],s=$("gd");for(var i=0;i<s.options.length;i++)if(s.options[i].text===w)s.selectedIndex=i;sub();drawQ()};
function gen(){var d=$("gd").value,a=$("ga").value,b=$("gb").value,n=$("gn").value,l=$("gl").value,cert=b==="Cebraspe";G={qs:[],i:0,ok:0,bad:0,a:null,load:true,err:"",d:d,logged:false};drawQ();
var p="Você é professor de concursos públicos brasileiros. Crie "+n+" questões inéditas de "+d+(a?", assunto: "+a:"")+", "+l.toLowerCase()+", no estilo da banca "+b+". "+(cert?"Formato Certo ou Errado: cada questão é uma afirmação e opts é [\"Certo\",\"Errado\"].":"Formato múltipla escolha com 4 alternativas plausíveis em opts, apenas uma correta.")+" Em Direito use a legislação vigente. Responda SOMENTE com JSON: [{\"q\":\"enunciado\",\"opts\":[...],\"ans\":indice da correta começando em 0,\"exp\":\"explicação curta citando a regra\"}]";
ai(p).then(function(r){if(!Array.isArray(r))throw {};G.qs=r.filter(function(x){return x&&x.q&&Array.isArray(x.opts)&&typeof x.ans==="number"&&x.opts[x.ans]!==undefined});G.load=false;if(!G.qs.length)G.err="Não consegui gerar questões válidas. Tente de novo.";drawQ()}).catch(function(e){G.load=false;G.err=emsg(e);drawQ()})}
function drawQ(){var el=$("gq");if(!el)return;
if(G.load){el.innerHTML='<div class="card sub">Gerando questões, pode levar alguns segundos...</div>';return}
if(G.err){el.innerHTML='<div class="card late">'+esc(G.err)+"</div>";return}
if(!G.qs.length){el.innerHTML="";return}
if(G.i>=G.qs.length){var t=G.ok+G.bad;el.innerHTML='<div class="card"><h2>Resultado</h2><div class="grid"><div class="stat"><b>'+G.ok+'</b><span>acertos</span></div><div class="stat"><b>'+G.bad+'</b><span>erros</span></div><div class="stat"><b>'+pct(G.ok,t)+'%</b><span>aproveitamento</span></div></div><div class="row">'+(G.logged?'<span class="sub">Registrado no seu controle.</span>':'<button class="b" onclick="logG()">Registrar no meu controle</button>')+'<button class="b g" onclick="gen()">Nova rodada</button></div></div>';return}
var q=G.qs[G.i],L="ABCDE",h='<div class="card"><div class="row" style="justify-content:space-between;margin:0"><span class="pill">'+(G.i+1)+" / "+G.qs.length+'</span><span class="sub" style="margin:0">'+G.ok+" certas · "+G.bad+' erradas</span></div><p>'+esc(q.q)+"</p>";
q.opts.forEach(function(o,j){var c="";if(G.a!==null){if(j===q.ans)c=" ok";else if(j===G.a)c=" bad"}h+='<button class="opt'+c+'" onclick="pick('+j+')">'+(q.opts.length>2?L[j]+") ":"")+esc(o)+"</button>"});
if(G.a!==null){h+="<p><b>"+(G.a===q.ans?"Correto.":"Incorreto.")+"</b> "+esc(q.exp||"")+'</p><div class="row">'+(G.a!==q.ans&&!q._e?'<button class="b g" onclick="errQ()">Anotar no caderno de erros</button>':"")+(!q._c?'<button class="b g" onclick="cardQ()">Virar flashcard</button>':"")+'<button class="b" onclick="nextQ()">'+(G.i+1<G.qs.length?"Próxima":"Ver resultado")+"</button></div>"}
el.innerHTML=h+"</div>"}
function pick(j){if(G.a!==null)return;G.a=j;if(j===G.qs[G.i].ans)G.ok++;else G.bad++;drawQ()}
function nextQ(){G.i++;G.a=null;drawQ()}
function logG(){S.log.push({id:Date.now(),d:today(),d2:G.d,n:G.ok+G.bad,c:G.ok});G.logged=true;save();drawQ();head()}
function errQ(){var q=G.qs[G.i];S.errs.push({id:Date.now(),d2:G.d,t:q.exp||q.q,r:0,next:addD(today(),7),ok:false});q._e=true;save();drawQ()}
function cardQ(){var q=G.qs[G.i];S.cards.push({id:Date.now(),d2:G.d,f:q.q,b:q.opts[q.ans]+(q.exp?" · "+q.exp:""),box:0,next:today()});q._c=true;save();drawQ()}
function dueC(){var t=today();return S.cards.filter(function(c){return c.next<=t})}
function renderCards(keep){S.cards=S.cards||[];if(!keep){C.q=dueC().map(function(c){return c.id});C.flip=false}
var dom=S.cards.filter(function(c){return c.box>=4}).length;
var list=S.cards.slice(-30).reverse().map(function(c){return'<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--bd);margin:4px 0"><span><span class="pill">'+esc(c.d2)+"</span> "+esc(c.f)+'</span><button class="b g" onclick="delC('+c.id+')">×</button></div>'}).join("");
$("v").innerHTML='<div class="grid"><div class="stat"><b>'+S.cards.length+'</b><span>flashcards</span></div><div class="stat"><b>'+dueC().length+'</b><span>para hoje</span></div><div class="stat"><b>'+dom+'</b><span>dominados</span></div></div><div id="cs" style="margin-top:12px"></div><div class="card"><h2>Gerar flashcards com IA</h2><div class="row"><select id="cd">'+dopts()+'</select><input id="ct" placeholder="Assunto (opcional)" style="flex:1;min-width:140px"><select id="cn"><option>5</option><option selected>10</option><option>15</option></select><button class="b" onclick="genC()">Gerar</button></div><p class="sub" id="cmsg"></p></div><div class="card"><h2>Criar manualmente</h2><div class="row"><select id="md">'+dopts()+'</select></div><input id="mf" placeholder="Frente (pergunta)" style="width:100%;margin:4px 0"><textarea id="mb" placeholder="Verso (resposta)"></textarea><div class="row"><button class="b" onclick="addC()">Adicionar</button></div></div>'+(list?'<div class="card"><h2>Seus flashcards</h2>'+list+"</div>":"");drawC()}
VIEW.cards=function(){renderCards(false)};
function drawC(){var el=$("cs");if(!el)return;var c=S.cards.filter(function(x){return x.id===C.q[0]})[0];
if(!c){el.innerHTML='<div class="card sub">'+(S.cards.length?"Nenhum flashcard para revisar hoje. Volte amanhã!":"Crie seus primeiros flashcards abaixo.")+"</div>";return}
el.innerHTML='<div class="card"><div class="row" style="justify-content:space-between;margin:0"><span class="pill">'+esc(c.d2)+'</span><span class="sub" style="margin:0">'+C.q.length+' na fila</span></div><div class="fc" onclick="flip()">'+esc(C.flip?c.b:c.f)+'</div><p class="sub" style="text-align:center">'+(C.flip?"Resposta":"Toque no cartão para ver a resposta")+"</p>"+(C.flip?'<div class="row" style="justify-content:center"><button class="b g" onclick="rate(0)">Errei</button><button class="b" onclick="rate(1)">Acertei</button></div>':"")+"</div>"}
function flip(){C.flip=!C.flip;drawC()}
function rate(ok){var c=S.cards.filter(function(x){return x.id===C.q[0]})[0];if(!c)return;if(ok){c.box=Math.min(c.box+1,4);c.next=addD(today(),INTC[c.box]);C.q.shift()}else{c.box=0;c.next=today();C.q.push(C.q.shift())}C.flip=false;save();renderCards(true)}
function delC(id){S.cards=S.cards.filter(function(c){return c.id!==id});save();renderCards(false)}
function addC(){var f=$("mf").value.trim(),b=$("mb").value.trim();if(!f||!b)return;S.cards.push({id:Date.now(),d2:$("md").value,f:f,b:b,box:0,next:today()});save();renderCards(false)}
function genC(){var d=$("cd").value,t=$("ct").value.trim(),n=$("cn").value;$("cmsg").textContent="Gerando flashcards...";
var p="Você é professor de concursos públicos brasileiros. Crie "+n+" flashcards de "+d+(t?", assunto: "+t:"")+", para concursos administrativos. Frente: pergunta curta. Verso: resposta curta e objetiva, citando a regra ou o artigo quando houver. Em Direito use a legislação vigente. Responda SOMENTE com JSON: [{\"f\":\"frente\",\"b\":\"verso\"}]";
ai(p).then(function(r){if(!Array.isArray(r))throw {};var k=0;r.forEach(function(x,i){if(x&&x.f&&x.b){S.cards.push({id:Date.now()+i,d2:d,f:String(x.f),b:String(x.b),box:0,next:today()});k++}});if(!k)throw {};save();renderCards(false)}).catch(function(e){var m=$("cmsg");if(m)m.textContent=emsg(e)})}
function tg(i){$("a"+i).classList.toggle("hide")}
function ck(i,j,v){var d=NAMES[i],x=topics(d)[j];if(v)S.done[d+"|"+x]=1;else delete S.done[d+"|"+x];save();var open=[];NAMES.forEach(function(_,k){if(!$("a"+k).classList.contains("hide"))open.push(k)});VIEW.assuntos();open.forEach(function(k){$("a"+k).classList.remove("hide")});head()}
function addT(i){var v=$("n"+i).value.trim();if(!v)return;S.custom.push({d:NAMES[i],t:v});save();VIEW.assuntos();$("a"+i).classList.remove("hide");head()}
function addLog(){var n=parseInt($("ln").value),c=parseInt($("lc").value);if(!(n>0)||!(c>=0)||c>n){alert("Confira os números: acertos não podem passar do total.");return}
S.log.push({id:Date.now(),d:today(),d2:$("ld").value,n:n,c:c});save();VIEW.hoje()}
function delLog(id){S.log=S.log.filter(function(l){return l.id!==id});save();VIEW.questoes()}
function addErr(){var t=$("et").value.trim();if(!t)return;S.errs.push({id:Date.now(),d2:$("ed").value,t:t,r:0,next:addD(today(),INT[0]),ok:false});save();VIEW.erros()}
function rev(id){S.errs.forEach(function(e){if(e.id===id){e.r++;if(e.r>=3)e.ok=true;else e.next=addD(today(),INT[e.r])}});save();VIEW.erros()}
function delErr(id){S.errs=S.errs.filter(function(e){return e.id!==id});save();VIEW.erros()}
function exp(){var b=new Blob([JSON.stringify(S)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="backup-estudos-"+today()+".json";a.click()}
function imp(el){var f=el.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var p=JSON.parse(r.result);S=Object.assign({done:{},custom:[],log:[],errs:[]},p);save();alert("Backup restaurado.");go("hoje")}catch(e){alert("Arquivo inválido.")}};r.readAsText(f)}
function wipe(){if(confirm("Apagar todo o progresso? Isso não pode ser desfeito.")){S={done:{},custom:[],log:[],errs:[]};save();go("hoje")}}
S.log.forEach(function(l){if(!l.d2)l.d2=l.disc||"Questões misturadas"});
go("hoje");
</script></body></html>
